[pytest]
# Pytest configuration for Tax-App-Backend

# Register custom markers
markers =
    integration: Integration tests that use real AWS services (run with: pytest -m integration)
    slow: Slow-running tests (run separately from unit tests)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show test durations (slowest 10 tests)
addopts = --durations=10
